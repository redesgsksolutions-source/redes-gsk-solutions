
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de certificados | REDES GSK SOLUTIONS S.A.C.</title>
<style>
body{font-family:Arial,sans-serif;background:#eef4fb;color:#17345c;margin:0;padding:20px}
main{max-width:760px;margin:30px auto;background:white;padding:25px;border-radius:12px;border-top:7px solid #0878c9;box-shadow:0 4px 18px #0001}
h1{font-size:25px}
input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #b9c8d8;border-radius:7px;font-size:16px}
.card{border:1px solid #d7e1ed;border-radius:9px;padding:16px;margin-top:16px}
a{color:#0878c9;font-weight:bold}
small{color:#66758a}
</style>
</head>
<body>
<main>
<h1>REDES GSK SOLUTIONS S.A.C.</h1>
<p>Registro general de certificados de trabajo</p>
<label for="buscar"><b>Buscar por nombre o número de certificado</b></label>
<input id="buscar" type="search" placeholder="Escribe un nombre o número">
<div id="resultados"></div>
<small>Los datos publicados son informativos. Para confirmar la autenticidad, contacte con la empresa emisora.</small>
</main>
<script>
const certificados = [
 {
  numero: "GSK-2022-2024-001",
  nombre: "Bani Josue Pacaya Yahuarcani",
  cargo: "Técnico electricista",
  periodo: "2022–2024",
  enlace: "verificar.html"
 }
];

const buscar = document.getElementById("buscar");
const resultados = document.getElementById("resultados");

function mostrar() {
 const texto = buscar.value.trim().toLowerCase();
 const encontrados = certificados.filter(c =>
  (c.nombre + " " + c.numero + " " + c.cargo).toLowerCase().includes(texto)
 );
 resultados.innerHTML = "";
 if (!encontrados.length) {
  resultados.textContent = "No se encontraron certificados.";
  return;
 }
 encontrados.forEach(c => {
  const tarjeta = document.createElement("section");
  tarjeta.className = "card";
  const titulo = document.createElement("h2");
  titulo.textContent = c.nombre;
  const info = document.createElement("p");
  info.textContent = c.cargo + " | Periodo: " + c.periodo;
  const numero = document.createElement("p");
  numero.textContent = "N.º de registro: " + c.numero;
  const enlace = document.createElement("a");
  enlace.href = c.enlace;
  enlace.textContent = "Consultar certificado";
  tarjeta.append(titulo, info, numero, enlace);
  resultados.appendChild(tarjeta);
 });
}
buscar.addEventListener("input", mostrar);
mostrar();
</script>
</body>
</html>
